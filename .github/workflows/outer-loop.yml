name: Outer Loop — Metamorphic Relations

on:
  push:
    paths:
      - "src/catalog/**"
      - "src/synthesizer/prompts/**"
  pull_request:
    paths:
      - "src/catalog/**"
      - "src/synthesizer/prompts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel an in-flight production deploy; only supersede branch runs
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  metamorphic-relations:
    timeout-minutes: 20
    name: Run MR tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run outer loop MR tests
        run: node --require tsx/cjs --test src/ci/outer-loop.test.ts
